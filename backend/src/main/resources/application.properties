# Em desenvolvimento, as variáveis podem ficar em backend/.env (veja .env.example)
spring.config.import=optional:file:.env[.properties]

spring.application.name=motivacional
server.port=${PORT:8080}

# Neon (Postgres): defina DATABASE_URL com a connection string do Neon (veja DatabaseUrlProcessor)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.admin-password=${ADMIN_PASSWORD:}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}

# Armazenamento S3-compatível (Cloudflare R2). Deixe em branco para desativar o envio de arquivos.
app.storage.endpoint=${STORAGE_ENDPOINT:}
app.storage.region=${STORAGE_REGION:auto}
app.storage.bucket=${STORAGE_BUCKET:}
app.storage.access-key=${STORAGE_ACCESS_KEY:}
app.storage.secret-key=${STORAGE_SECRET_KEY:}
app.storage.public-url=${STORAGE_PUBLIC_URL:}
